name: App CI

# Informative for now: this is not a required check, so a red run does not block
# a merge yet. It becomes required once it has run green on main for a while.

# CI for the hosted app (apps/web). The database tests run three times: once on
# the embedded PGlite; once on a real Postgres 16 server as an ordinary login
# (no superuser, no CREATEDB, no BYPASSRLS) that owns and migrates its tables;
# and once in the deployed shape, where rolewright_owner migrates and the app
# login owns nothing and runs no DDL. Nothing is allowed to skip on Postgres
# (ADR 0009: row-level security and row locks are proven on real Postgres).
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/engine/**'
      - '!packages/engine/web/**'
      - '.github/workflows/app-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/engine/**'
      - '!packages/engine/web/**'
      - '.github/workflows/app-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    name: app typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18', '24']
    defaults:
      run:
        working-directory: apps/web
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-admin-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # The roles of the deployed shape (P1-17): rolewright_owner migrates and
      # owns the tables; rolewright_login is the app login and owns nothing; it
      # switches to rolewright_app for user data and reaches the sign-in tables
      # through rolewright_system. The tests create and drop their own databases
      # (the admin URL does that), so no `rolewright` database is needed here.
      - name: Create the database roles
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: ci-admin-password
        run: |
          psql -v ON_ERROR_STOP=1 postgres <<'SQL'
          CREATE ROLE rolewright_owner LOGIN PASSWORD 'ci-owner-password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          CREATE ROLE rolewright_login LOGIN PASSWORD 'ci-login-password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          CREATE ROLE rolewright_app NOLOGIN NOSUPERUSER NOBYPASSRLS;
          CREATE ROLE rolewright_system NOLOGIN NOSUPERUSER NOBYPASSRLS;
          GRANT rolewright_app, rolewright_system TO rolewright_login;
          SQL

      # The fact gate and the PDF renderer live in the engine, which the app
      # loads from the repository. It has no lockfile, so the install is
      # `npm install` without scripts (as test.yml does), then the Chromium that
      # its pinned Playwright version wants, installed with the system libraries.
      - name: Install engine dependencies
        run: npm install --ignore-scripts
        working-directory: packages/engine
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: packages/engine

      - run: npm ci
      - run: npm run typecheck
      - name: Tests on the embedded database
        run: npm test
      - name: Tests on Postgres 16, as the non-superuser login, nothing skipped
        run: npm test
        env:
          ROLEWRIGHT_TEST_DATABASE_URL: postgres://rolewright_login:ci-login-password@localhost:5432/postgres
          ROLEWRIGHT_TEST_ADMIN_URL: postgres://postgres:ci-admin-password@localhost:5432/postgres
          ROLEWRIGHT_REQUIRE_PG: '1'
      - name: Tests on Postgres 16, as a non-owner login, nothing skipped
        run: npm test
        env:
          ROLEWRIGHT_TEST_OWNER_URL: postgres://rolewright_owner:ci-owner-password@localhost:5432/postgres
          ROLEWRIGHT_TEST_DATABASE_URL: postgres://rolewright_login:ci-login-password@localhost:5432/postgres
          ROLEWRIGHT_TEST_ADMIN_URL: postgres://postgres:ci-admin-password@localhost:5432/postgres
          ROLEWRIGHT_REQUIRE_PG: '1'
      - run: npm run test:flow
      - run: npm run build
