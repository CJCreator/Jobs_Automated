name: Feature request
description: Suggest an improvement to Rolewright
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        > Never paste personal data. Check `docs/adr/` first: a change to an accepted decision needs a new ADR.
  - type: textarea
    id: problem
    attributes:
      label: Which job seeker problem does this solve?
      description: Who is it for (fresher, experienced hire, career switcher) and what blocks them today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
