name: Bug report
description: Report a bug in Rolewright
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        > **Privacy first.** Never paste a resume, a job description you were given privately, an API key, or any personal data. Issues are public. Share only sanitized snippets.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Area
      description: apps/web (hosted app) or packages/engine (engine / CLI)
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      render: shell
